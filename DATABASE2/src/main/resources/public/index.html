<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestor de Tareas – Login</title>
    <style>
        /* Paleta en escala de grises */
:root {
  --color-bg: #f0f0f0;
  --color-card: #ffffff;
  --color-primary: #3c3c3c;
  --color-secondary: #6c6c6c;
  --color-text: #2a2a2a;
  --color-border: #dcdcdc;
}

/* Reset básico */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background-color: var(--color-bg);
  font-family: 'Segoe UI', Tahoma, sans-serif;
  color: var(--color-text);
  line-height: 1.6;
  padding: 20px;
  overflow-x: hidden;
}

/* Títulos */
h1, h2 {
  margin-bottom: 10px;
  color: var(--color-primary);
}

/* Secciones */
.section {
  background: var(--color-card);
  border: 1px solid var(--color-border);
  border-radius: 8px;
  padding: 15px;
  margin-top: 20px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

/* Formularios */
.form-group {
  margin-bottom: 12px;
}

input[type="text"],
input[type="password"],
input[type="number"],
textarea {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--color-border);
  border-radius: 4px;
  font-size: 14px;
  background-color: #fafafa;
  color: var(--color-text);
}

/* Botones */
button {
  width: 9em;
  height: 3em;
  border-radius: 30em;
  font-size: 15px;
  font-family: inherit;
  border: none;
  position: relative;
  cursor: pointer;
  overflow: hidden;
  background-color: #444444;
  color: #ffffff;
  z-index: 1;
  box-shadow: 6px 6px 12px #b5b5b5, -6px -6px 12px #ffffff;
}

button::before {
  content: '';
  width: 0;
  height: 3em;
  border-radius: 30em;
  position: absolute;
  top: 0;
  left: 0;
  background-image: linear-gradient(to right, #9e9e9e, #5f5f5f, #3a3a3a);
  transition: 0.5s ease;
  display: block;
  z-index: -1;
}

button:hover::before {
  width: 9em;
}

button span,
button {
  position: relative;
  z-index: 2;
}

/* Tarjetas de lista */
.tarea,
.usuario,
.categoria {
  background: var(--color-card);
  border: 1px solid var(--color-border);
  border-radius: 6px;
  padding: 10px;
  margin-bottom: 8px;
  color: var(--color-primary);
}

    </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginForm">
    <h2>Iniciar Sesión</h2>
    <form id="formLogin">
        <div class="form-group">
            <input type="text" id="username" placeholder="Nombre de usuario" value="root" required>
        </div>
        <div class="form-group">
            <input type="password" id="password" placeholder="Contraseña" value="Srot405@" required>
        </div>
        <button><span>Iniciar Sesión</span></button>
    </form>
</div>

<!-- GESTOR DE TAREAS -->
<div id="appSection" style="display: none;">
    <h1>Gestor de Tareas</h1>

    <!-- Usuarios -->
    <div class="section">
        <h2>Usuarios</h2>
        <form id="formUsuario">
            <div class="form-group">
                <input type="number" id="usuarioID" placeholder="ID de usuario" required>
            </div>
            <div class="form-group">
                <input type="text" id="nombreUsuario" placeholder="Nombre de usuario" required>
            </div>
            <div class="form-group">
                <input type="password" id="contrasenaUsuario" placeholder="Contraseña" required>
            </div>
            <button><span>Agregar Usuario</span></button>
        </form>
        <form id="formEliminarUsuario" style="margin-top:10px;">
            <div class="form-group">
                <input type="number" id="eliminarUsuarioID" placeholder="ID de usuario a eliminar" required>
            </div>
            <button><span>Eliminar Usuario</span></button>
        </form>
    </div>

    <!-- Categorías -->
    <div class="section">
        <h2>Categorías</h2>
        <form id="formCategoria">
            <div class="form-group">
                <input type="number" id="categoriaID" placeholder="ID de categoría" required>
            </div>
            <div class="form-group">
                <input type="text" id="nombreCategoria" placeholder="Nombre de la categoría" required>
            </div>
            <button><span>Agregar Categoría</span></button>
        </form>
        <form id="formEliminarCategoria" style="margin-top:10px;">
            <div class="form-group">
                <input type="number" id="eliminarCategoriaID" placeholder="ID de categoría a eliminar" required>
            </div>
            <button><span>Eliminar Categoría</span></button>
        </form>
    </div>

    <!-- Tareas -->
    <div class="section">
        <h2>Tareas</h2>
        <form id="formTarea">
            <div class="form-group">
                <input type="text" id="nombreTarea" placeholder="Nombre de la tarea" required>
            </div>
            <div class="form-group">
                <textarea id="descripcionTarea" placeholder="Descripción" required></textarea>
            </div>
            <div class="form-group">
                <input type="number" id="usuarioIDTarea" placeholder="ID del usuario" required>
            </div>
            <div class="form-group">
                <input type="number" id="categoriaIDTarea" placeholder="ID de la categoría" required>
            </div>
            <div class="form-group">
                <input type="date" id="fechaInicioTarea" placeholder="Fecha de inicio" required>
            </div>
            <div class="form-group">
                <input type="date" id="fechaFinTarea" placeholder="Fecha de finalización" required>
            </div>
            <div class="form-group">
                <select id="estadoTarea" required>
                    <option value="false">Pendiente</option>
                    <option value="true">Completada</option>
                </select>
            </div>
            <button><span>Agregar Tarea</span></button>
        </form>
        <form id="formEliminarTarea" style="margin-top:10px;">
            <div class="form-group">
                <input type="number" id="eliminarTareaID" placeholder="ID de la tarea a eliminar" required>
            </div>
            <button><span>Eliminar Tarea</span></button>
        </form>
    </div>

    <!-- Lista de Tareas -->
    <div class="section">
        <h2>Lista de Tareas</h2>
        <div id="tareas"></div>
    </div>
</div>

<script>
    // LOGIN
    const formLogin = document.getElementById("formLogin");
    const loginForm = document.getElementById("loginForm");
    const appSection = document.getElementById("appSection");
    formLogin.addEventListener("submit", e => {
        e.preventDefault();
        const user = document.getElementById("username").value.trim();
        const pass = document.getElementById("password").value.trim();
        fetch("http://localhost:4567/login", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: `username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`
        })
        .then(res => { if (!res.ok) throw new Error(); return res.text(); })
        .then(() => { loginForm.style.display="none"; appSection.style.display="block"; cargarTareas(); })
        .catch(() => alert("Credenciales incorrectas"));
    });
    // Helper: petición y reset
    function simpleRequest(url, opts, onSuccess) {
      fetch(url, opts)
        .then(r => r.ok ? r.text() : r.text().then(t => Promise.reject(t)))
        .then(msg => { alert(msg); onSuccess(); })
        .catch(err => alert(err));
    }
    // Usuario
    document.getElementById("formUsuario").addEventListener("submit", e => {
        e.preventDefault();
        const id = document.getElementById("usuarioID").value;
        const name = document.getElementById("nombreUsuario").value;
        const pwd = document.getElementById("contrasenaUsuario").value;
        simpleRequest("http://localhost:4567/usuario", {
          method: "POST",
          headers: {"Content-Type":"application/x-www-form-urlencoded"},
          body: `usuarioID=${id}&nombre=${encodeURIComponent(name)}&contrasena=${encodeURIComponent(pwd)}`
        }, () => {
          e.target.reset();
        });
    });
    document.getElementById("formEliminarUsuario").addEventListener("submit", e => {
        e.preventDefault();
        const id = document.getElementById("eliminarUsuarioID").value;
        simpleRequest(`http://localhost:4567/usuario/${id}`, { method: "DELETE" }, () => {
          e.target.reset();
        });
    });
    // Categoría
    document.getElementById("formCategoria").addEventListener("submit", e => {
        e.preventDefault();
        const id = document.getElementById("categoriaID").value;
        const name = document.getElementById("nombreCategoria").value;
        simpleRequest("http://localhost:4567/categoria", {
          method: "POST",
          headers: {"Content-Type":"application/x-www-form-urlencoded"},
          body: `categoriaID=${id}&nombre=${encodeURIComponent(name)}`
        }, () => { e.target.reset(); });
    });
    document.getElementById("formEliminarCategoria").addEventListener("submit", e => {
        e.preventDefault();
        const id = document.getElementById("eliminarCategoriaID").value;
        simpleRequest(`http://localhost:4567/categoria/${id}`, { method: "DELETE" }, () => { e.target.reset(); });
    });
    // Tarea
    document.getElementById("formTarea").addEventListener("submit", e => {
        e.preventDefault();
        const name = document.getElementById("nombreTarea").value;
        const desc = document.getElementById("descripcionTarea").value;
        const uid = document.getElementById("usuarioIDTarea").value;
        const cid = document.getElementById("categoriaIDTarea").value;
        const fechaInicio = document.getElementById("fechaInicioTarea").value;
        const fechaFin = document.getElementById("fechaFinTarea").value;
        const estado = document.getElementById("estadoTarea").value;
        simpleRequest("http://localhost:4567/tarea", {
          method: "POST", headers:{"Content-Type":"application/x-www-form-urlencoded"},
          body: `nombre=${encodeURIComponent(name)}&descripcion=${encodeURIComponent(desc)}&usuarioID=${uid}&categoriaID=${cid}&fechaDeInicio=${fechaInicio}&fechaDeFinalizacion=${fechaFin}&estado=${estado}`
        }, () => { e.target.reset(); cargarTareas(); });
    });
    document.getElementById("formEliminarTarea").addEventListener("submit", e => {
        e.preventDefault();
        const id = document.getElementById("eliminarTareaID").value;
        simpleRequest(`http://localhost:4567/tarea/${id}`, { method:"DELETE" }, () => { e.target.reset(); cargarTareas(); });
    });
    // Listar tareas
    const tareasDiv = document.getElementById("tareas");
    function cargarTareas() {
        fetch("http://localhost:4567/tarea")
          .then(r => r.ok? r.json(): Promise.reject())
          .then(list => {
            tareasDiv.innerHTML = "";
            list.forEach(t => {
              const d = document.createElement("div"); d.className="tarea";
              d.innerHTML = `<strong>${t.nombre}</strong><br><em>${t.descripcion}</em><br>` +
                            `Inicio: ${t.fechaDeInicio} - Fin: ${t.fechaDeFinalizacion}<br>` +
                            `Usuario: ${t.usuario} | Categoría: ${t.categoria}<br>` +
                            `Estado: ${t.estado=="true"||t.estado===true?"Completada":"Pendiente"}`;
              tareasDiv.appendChild(d);
            });
          })
          .catch(() => { tareasDiv.innerHTML = "<p style='color:red;'>Error al cargar tareas.</p>"; });
    }
</script>
</body>
</html>
